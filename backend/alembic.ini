# Alembic, for the command line only.
#
# The application does not read this file. It builds the same configuration in
# code, in app/db/schema.py, because a packaged application cannot rely on a
# file sitting next to a repository layout that will not exist — invariant 8.
# This file is what `alembic revision --autogenerate` uses when a new revision
# is written, run from the backend/ directory.
#
#   backend\.venv\Scripts\alembic.exe revision --autogenerate -m "what it does"
#
# The URL below is a scratch database, never the real one. Autogenerate
# compares the models against whatever it is pointed at, and pointing it at the
# live database would mean writing revisions against a file that is already in
# use. Point it somewhere disposable, upgrade that to head first, then generate.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///alembic-scratch.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
